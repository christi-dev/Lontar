<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lontar Cake Papua - Pesan Kue Lontar Tradisional & Lezat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase (database, login, realtime) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf2f2',
                            100: '#fbe8e8',
                            500: '#e53935',
                            600: '#d32f2f',
                            700: '#c62828',
                            800: '#b71c1c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fafafa;
            color: #1f2937;
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-50 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // =====================================================================
        //  KONFIGURASI SUPABASE
        //  Ambil dari Supabase Dashboard > Project Settings > API.
        //  "anon public key" memang aman ditaruh di website: keamanan data
        //  dijaga oleh Row Level Security (RLS) di database.
        // =====================================================================
        const SUPABASE_URL = "https://fbgmhhdbzzbujdlrbncw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_cQZM0tkYcbxAM2dWmoa4mA_-MujAUaT";

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const IS_CONFIGURED = !SUPABASE_URL.includes("YOUR-PROJECT-ID") && !SUPABASE_ANON_KEY.startsWith("YOUR-");

        // Gambar produk (file di folder images/ proyek ini)
        const IMAGES = {
            original: "images/original.jpg",
            originalKeju: "images/originalKeju.jpg",
            coklat: "images/coklat.jpg",
            coklatKeju: "images/coklatKeju.jpg"
        };
        const FALLBACK_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#fbe8e8"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="20" fill="#c62828">Lontar Cake Papua</text></svg>'
        );
        const onImgError = (e) => { if (e.currentTarget.src !== FALLBACK_IMG) e.currentTarget.src = FALLBACK_IMG; };

        const SHIPPING_FEE = 15000;

        // ---------- Helper format data dari database ke bentuk yang dipakai UI ----------
        const formatDate = (iso) => {
            if (!iso) return "";
            return new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };
        const timeAgo = (iso) => {
            const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
            if (diff < 60) return "Baru saja";
            if (diff < 3600) return `${Math.floor(diff / 60)}m lalu`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}j lalu`;
            return formatDate(iso);
        };
        const mapProduct = (p) => ({
            id: p.id,
            name: p.name,
            size: p.size,
            price: p.price,
            stock: p.stock,
            image: p.image_url || FALLBACK_IMG,
            image_url: p.image_url,
            description: p.description,
            is_active: p.is_active
        });
        const mapOrder = (o) => ({
            id: o.id,
            userId: o.user_id,
            customer: o.customer_name,
            items: (o.order_items || []).map(i => ({ name: i.product_name, quantity: i.quantity, price: i.price })),
            subtotal: o.subtotal,
            total: o.total,
            address: o.address,
            status: o.status,
            paymentMethod: o.payment_method,
            date: formatDate(o.created_at)
        });
        const mapNotif = (n) => ({ id: n.id, text: n.text, time: timeAgo(n.created_at), read: n.is_read });

        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [currentView, setCurrentView] = useState("home");
            const [products, setProducts] = useState([]);
            const [productsLoading, setProductsLoading] = useState(true);
            const [cart, setCart] = useState(() => {
                try { return JSON.parse(localStorage.getItem('lontar_cart') || '[]'); } catch (e) { return []; }
            });
            const [orders, setOrders] = useState([]);
            const [activeOrder, setActiveOrder] = useState(null);
            const [userNotifications, setUserNotifications] = useState([]);
            const [adminNotifications, setAdminNotifications] = useState([]);

            const [toast, setToast] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3500);
            };

            // Simpan keranjang di browser supaya tidak hilang saat refresh
            useEffect(() => {
                try { localStorage.setItem('lontar_cart', JSON.stringify(cart)); } catch (e) {}
            }, [cart]);

            // ---------- PRODUK ----------
            const fetchProducts = useCallback(async () => {
                const { data, error } = await db.from('products').select('*').order('id');
                if (error) { console.error("Gagal memuat produk:", error); }
                else setProducts(data.map(mapProduct));
                setProductsLoading(false);
            }, []);

            // ---------- PESANAN ----------
            const fetchOrders = useCallback(async () => {
                const { data, error } = await db
                    .from('orders')
                    .select('*, order_items(*)')
                    .order('created_at', { ascending: false });
                if (error) { console.error("Gagal memuat pesanan:", error); return; }
                const mapped = data.map(mapOrder);
                setOrders(mapped);
                setActiveOrder(prev => (prev && mapped.find(o => o.id === prev.id)) || mapped[0] || null);
            }, []);

            // ---------- NOTIFIKASI ----------
            const fetchNotifications = useCallback(async (user) => {
                if (!user) return;
                let q = db.from('notifications').select('*').order('created_at', { ascending: false }).limit(30);
                q = user.role === 'admin' ? q.eq('for_admin', true) : q.eq('user_id', user.id);
                const { data, error } = await q;
                if (error) { console.error("Gagal memuat notifikasi:", error); return; }
                const mapped = data.map(mapNotif);
                if (user.role === 'admin') setAdminNotifications(mapped); else setUserNotifications(mapped);
            }, []);

            // ---------- AUTH: pulihkan sesi login & dengarkan perubahan ----------
            const loadProfile = useCallback(async (session) => {
                if (!session?.user) {
                    setCurrentUser(null);
                    setOrders([]); setActiveOrder(null);
                    setUserNotifications([]); setAdminNotifications([]);
                    return;
                }
                const { data: profile, error } = await db.from('profiles').select('*').eq('id', session.user.id).single();
                if (error) { console.error("Gagal memuat profil:", error); }
                setCurrentUser({
                    id: session.user.id,
                    name: profile?.full_name || session.user.email,
                    email: session.user.email,
                    role: profile?.role || 'user'
                });
            }, []);

            useEffect(() => {
                if (!IS_CONFIGURED) { setProductsLoading(false); setAuthReady(true); return; }
                fetchProducts();
                db.auth.getSession().then(({ data }) => loadProfile(data.session).finally(() => setAuthReady(true)));
                const { data: sub } = db.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_UPDATED') {
                        setTimeout(() => loadProfile(session), 0);
                    }
                });
                return () => sub.subscription.unsubscribe();
            }, []);

            // Muat pesanan & notifikasi setiap kali user berganti, lalu langganan realtime
            useEffect(() => {
                if (!currentUser) return;
                fetchOrders();
                fetchNotifications(currentUser);

                const channel = db.channel(`live-${currentUser.id}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => fetchOrders())
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, () => fetchNotifications(currentUser))
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => fetchProducts())
                    .subscribe();
                return () => { db.removeChannel(channel); };
            }, [currentUser?.id, currentUser?.role]);

            const logout = async () => {
                await db.auth.signOut();
                setCart([]);
                setCurrentView('home');
                showToast("Berhasil logout.");
            };

            const addToCart = (product) => {
                if (!currentUser) {
                    showToast("Harap daftar atau login terlebih dahulu sebelum menambahkan ke keranjang!");
                    setCurrentView('auth');
                    return;
                }
                if (currentUser.role === 'admin') {
                    showToast("Akun Admin tidak dapat melakukan pembelian. Silakan gunakan akun customer/user.");
                    return;
                }
                if (product.stock <= 0) {
                    showToast("Maaf, stok produk ini sedang habis.");
                    return;
                }

                const existing = cart.find(item => item.product.id === product.id);
                if (existing) {
                    if (existing.quantity >= product.stock) {
                        showToast("Stok produk tidak mencukupi!");
                        return;
                    }
                    setCart(cart.map(item => item.product.id === product.id ? {...item, quantity: item.quantity + 1} : item));
                } else {
                    setCart([...cart, { product, quantity: 1 }]);
                }
                showToast(`Berhasil menambahkan ${product.name} ke keranjang!`);
            };

            const updateCartQty = (productId, delta) => {
                setCart(cart.map(item => {
                    if (item.product.id === productId) {
                        const newQty = item.quantity + delta;
                        const live = products.find(p => p.id === productId);
                        if (delta > 0 && live && newQty > live.stock) {
                            showToast("Stok produk tidak mencukupi!");
                            return item;
                        }
                        return newQty > 0 ? {...item, quantity: newQty} : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            const cartItemCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            return (
                <div className="min-h-screen flex flex-col bg-gray-50 text-gray-800">
                    {toast && (
                        <div className="fixed top-5 right-5 z-50 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition-all animate-bounce">
                            <i className="fa-solid fa-circle-check text-green-400 text-lg"></i>
                            <span className="font-medium text-sm">{toast}</span>
                        </div>
                    )}

                    {!IS_CONFIGURED && (
                        <div className="bg-amber-100 text-amber-900 text-xs text-center py-2 px-4 font-semibold">
                            Database belum terhubung: isi SUPABASE_URL dan SUPABASE_ANON_KEY di index.html (lihat README).
                        </div>
                    )}

                    <Navbar
                        currentUser={currentUser}
                        logout={logout}
                        currentView={currentView}
                        setCurrentView={setCurrentView}
                        cartItemCount={cartItemCount}
                        userNotifications={userNotifications}
                        setUserNotifications={setUserNotifications}
                        adminNotifications={adminNotifications}
                        setAdminNotifications={setAdminNotifications}
                    />

                    <main className="flex-grow">
                        {currentView === 'auth' && (
                            <AuthScreen
                                currentUser={currentUser}
                                setCurrentView={setCurrentView}
                                showToast={showToast}
                            />
                        )}
                        {currentView === 'home' && (
                            <HomeScreen
                                products={products}
                                productsLoading={productsLoading}
                                setCurrentView={setCurrentView}
                                addToCart={addToCart}
                            />
                        )}
                        {currentView === 'products' && (
                            <ProductsScreen
                                products={products}
                                productsLoading={productsLoading}
                                addToCart={addToCart}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                            />
                        )}
                        {currentView === 'about' && (
                            <AboutScreen />
                        )}
                        {currentView === 'cart' && (
                            <CartScreen
                                cart={cart}
                                updateCartQty={updateCartQty}
                                cartTotal={cartTotal}
                                setCurrentView={setCurrentView}
                            />
                        )}
                        {currentView === 'checkout' && (
                            <CheckoutScreen
                                cart={cart}
                                cartTotal={cartTotal}
                                setCart={setCart}
                                setActiveOrder={setActiveOrder}
                                setCurrentView={setCurrentView}
                                showToast={showToast}
                                currentUser={currentUser}
                                fetchOrders={fetchOrders}
                                fetchProducts={fetchProducts}
                            />
                        )}
                        {currentView === 'tracking' && currentUser?.role === 'user' && (
                            <TrackingScreen
                                orders={orders}
                                activeOrder={activeOrder}
                                setActiveOrder={setActiveOrder}
                                setCurrentView={setCurrentView}
                            />
                        )}
                        {currentView === 'admin' && currentUser?.role === 'admin' && (
                            <AdminScreen
                                products={products}
                                fetchProducts={fetchProducts}
                                orders={orders}
                                setOrders={setOrders}
                                fetchOrders={fetchOrders}
                                showToast={showToast}
                            />
                        )}
                        {(currentView === 'tracking' || currentView === 'admin') && authReady && !currentUser && (
                            <div className="max-w-md mx-auto my-16 text-center space-y-4">
                                <h2 className="text-xl font-bold">Silakan login terlebih dahulu</h2>
                                <button onClick={() => setCurrentView('auth')} className="bg-brand-600 text-white px-6 py-3 rounded-xl text-xs font-bold">Login / Daftar</button>
                            </div>
                        )}
                    </main>

                    <Footer setCurrentView={setCurrentView} />
                </div>
            );
        }

        function Navbar({ 
            currentUser,
            logout,
            currentView,
            setCurrentView, 
            cartItemCount,
            userNotifications,
            setUserNotifications,
            adminNotifications,
            setAdminNotifications
        }) {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [showNotifDropdown, setShowNotifDropdown] = useState(false);

            const unreadUserCount = userNotifications.filter(n => !n.read).length;
            const unreadAdminCount = adminNotifications.filter(n => !n.read).length;
            const currentUnread = currentUser?.role === 'admin' ? unreadAdminCount : unreadUserCount;

            const markNotificationsAsRead = async () => {
                const list = currentUser?.role === 'admin' ? adminNotifications : userNotifications;
                const unreadIds = list.filter(n => !n.read).map(n => n.id);
                if (currentUser?.role === 'admin') {
                    setAdminNotifications(adminNotifications.map(n => ({...n, read: true})));
                } else {
                    setUserNotifications(userNotifications.map(n => ({...n, read: true})));
                }
                if (unreadIds.length > 0) {
                    const { error } = await db.from('notifications').update({ is_read: true }).in('id', unreadIds);
                    if (error) console.error("Gagal menandai notifikasi:", error);
                }
            };

            return (
                <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentView('home')}>
                            <div>
                                <span className="text-2xl font-extrabold tracking-tight text-brand-600 font-sans">Lontar<span className="text-gray-900"> Cake Papua</span></span>
                                <span className="block text-[10px] text-gray-500 uppercase tracking-widest font-semibold">Autentik & Lezat</span>
                            </div>
                        </div>

                        <nav className="hidden md:flex items-center space-x-8 font-medium text-sm">
                            <button 
                                onClick={() => setCurrentView('home')} 
                                className={`transition-colors pb-1 border-b-2 ${currentView === 'home' ? 'text-brand-600 border-brand-600 font-semibold' : 'text-gray-600 border-transparent hover:text-brand-600'}`}>
                                Home
                            </button>
                            <button 
                                onClick={() => setCurrentView('products')} 
                                className={`transition-colors pb-1 border-b-2 ${currentView === 'products' ? 'text-brand-600 border-brand-600 font-semibold' : 'text-gray-600 border-transparent hover:text-brand-600'}`}>
                                Produk
                            </button>
                            <button 
                                onClick={() => setCurrentView('about')} 
                                className={`transition-colors pb-1 border-b-2 ${currentView === 'about' ? 'text-brand-600 border-brand-600 font-semibold' : 'text-gray-600 border-transparent hover:text-brand-600'}`}>
                                About Us
                            </button>
                            <a 
                                href="https://wa.me/6281234567890?text=Halo%20Admin%20Lontar%20Cake%20Papua,%20saya%20ingin%20bertanya%20mengenai%20pesanan%20kue%20lontar." 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="text-gray-600 hover:text-brand-600 transition-colors flex items-center space-x-1">
                                <i className="fa-brands fa-whatsapp text-green-600 text-base"></i>
                                <span>Contact Us</span>
                            </a>
                            {currentUser?.role === 'admin' && (
                                <button 
                                    onClick={() => setCurrentView('admin')} 
                                    className={`transition-colors pb-1 border-b-2 ${currentView === 'admin' ? 'text-brand-600 border-brand-600 font-semibold' : 'text-gray-600 border-transparent hover:text-brand-600'}`}>
                                    <i className="fa-solid fa-gauge-high mr-1"></i> Admin Dashboard
                                </button>
                            )}
                        </nav>

                        <div className="flex items-center space-x-3">
                            {currentUser && (
                                <div className="relative">
                                    <button 
                                        onClick={() => {
                                            setShowNotifDropdown(!showNotifDropdown);
                                            markNotificationsAsRead();
                                        }}
                                        className="relative p-2.5 rounded-full bg-gray-100 text-gray-700 hover:bg-brand-50 hover:text-brand-600 transition-all">
                                        <i className="fa-solid fa-bell text-base"></i>
                                        {currentUnread > 0 && (
                                            <span className="absolute -top-1 -right-1 bg-brand-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold shadow animate-pulse">
                                                {currentUnread}
                                            </span>
                                        )}
                                    </button>

                                    {showNotifDropdown && (
                                        <div className="absolute right-0 mt-3 w-80 bg-white rounded-3xl shadow-2xl border border-gray-100 py-4 px-5 z-50">
                                            <div className="flex justify-between items-center mb-3 border-b pb-2">
                                                <h4 className="font-bold text-sm text-gray-900">
                                                    Notifikasi {currentUser.role === 'admin' ? 'Admin (Pesanan Masuk)' : 'User'}
                                                </h4>
                                                <span className="text-[10px] text-gray-400">Terbaru</span>
                                            </div>
                                            <div className="space-y-3 max-h-64 overflow-y-auto">
                                                {(currentUser.role === 'admin' ? adminNotifications : userNotifications).length === 0 ? (
                                                    <p className="text-xs text-gray-500 text-center py-4">Belum ada notifikasi.</p>
                                                ) : (
                                                    (currentUser.role === 'admin' ? adminNotifications : userNotifications).map(n => (
                                                        <div key={n.id} className="p-3 bg-brand-50/50 rounded-2xl border border-brand-100 text-xs space-y-1">
                                                            <p className="font-medium text-gray-800">{n.text}</p>
                                                            <span className="text-[10px] text-brand-600 font-bold block text-right">{n.time}</span>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {currentUser?.role === 'user' && (
                                <button 
                                    onClick={() => setCurrentView('tracking')} 
                                    title="Tracking Pesanan"
                                    className={`relative p-2.5 rounded-full transition-all ${currentView === 'tracking' ? 'bg-brand-600 text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-brand-50 hover:text-brand-600'}`}>
                                    <i className="fa-solid fa-motorcycle text-base"></i>
                                </button>
                            )}

                            {currentUser?.role !== 'admin' && (
                                <button 
                                    onClick={() => setCurrentView('cart')} 
                                    className="relative p-2.5 rounded-full bg-gray-100 text-gray-700 hover:bg-brand-50 hover:text-brand-600 transition-all">
                                    <i className="fa-solid fa-cart-shopping text-base"></i>
                                    {cartItemCount > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-brand-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold shadow">
                                            {cartItemCount}
                                        </span>
                                    )}
                                </button>
                            )}

                            {currentUser ? (
                                <div className="hidden sm:flex items-center space-x-2 bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-full">
                                    <div className="w-7 h-7 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-xs">
                                        {currentUser.name.charAt(0)}
                                    </div>
                                    <div className="text-left max-w-[100px] truncate">
                                        <div className="text-xs font-bold text-gray-800 truncate">{currentUser.name}</div>
                                        <div className="text-[9px] text-gray-500 capitalize">{currentUser.role}</div>
                                    </div>
                                    <button 
                                        onClick={logout}
                                        title="Logout"
                                        className="text-gray-400 hover:text-brand-600 ml-1 text-xs">
                                        <i className="fa-solid fa-right-from-bracket"></i>
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setCurrentView('auth')}
                                    className="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-full font-semibold text-xs shadow-md transition-all">
                                    Login / Daftar
                                </button>
                            )}

                            <button 
                                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                className="md:hidden p-2 text-gray-600 hover:text-brand-600">
                                <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-lg`}></i>
                            </button>
                        </div>
                    </div>

                    {mobileMenuOpen && (
                        <div className="md:hidden bg-white border-b border-gray-200 px-6 py-4 space-y-3 font-medium text-sm">
                            <button onClick={() => { setCurrentView('home'); setMobileMenuOpen(false); }} className="block w-full text-left py-2 text-gray-700 hover:text-brand-600">Home</button>
                            <button onClick={() => { setCurrentView('products'); setMobileMenuOpen(false); }} className="block w-full text-left py-2 text-gray-700 hover:text-brand-600">Produk</button>
                            <button onClick={() => { setCurrentView('about'); setMobileMenuOpen(false); }} className="block w-full text-left py-2 text-gray-700 hover:text-brand-600">About Us</button>
                            <a href="https://wa.me/6281234567890" target="_blank" rel="noopener noreferrer" className="block w-full text-left py-2 text-gray-700 hover:text-brand-600">Contact Us (WhatsApp)</a>
                            {currentUser?.role === 'admin' && (

        function AuthScreen({ currentUser, setCurrentView, showToast }) {
            const [isLogin, setIsLogin] = useState(true);
            const [name, setName] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [loading, setLoading] = useState(false);
            const [pendingLogin, setPendingLogin] = useState(false);

            // Setelah login berhasil & profil termuat, arahkan sesuai role
            useEffect(() => {
                if (pendingLogin && currentUser) {
                    setPendingLogin(false);
                    showToast(`Berhasil login sebagai ${currentUser.role === 'admin' ? 'ADMIN' : 'CUSTOMER'}!`);
                    setCurrentView(currentUser.role === 'admin' ? 'admin' : 'home');
                }
            }, [pendingLogin, currentUser]);

            const translateError = (msg = "") => {
                if (msg.includes("Invalid login credentials")) return "Email atau password salah.";
                if (msg.includes("Email not confirmed")) return "Email belum dikonfirmasi. Cek kotak masuk email Anda.";
                if (msg.includes("already registered")) return "Email sudah terdaftar. Silakan login.";
                if (msg.includes("Password should be")) return "Password minimal 6 karakter.";
                return msg || "Terjadi kesalahan, coba lagi.";
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!IS_CONFIGURED) { showToast("Database belum dikonfigurasi."); return; }
                setLoading(true);
                try {
                    if (isLogin) {
                        const { error } = await db.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        setPendingLogin(true);
                    } else {
                        const { data, error } = await db.auth.signUp({
                            email,
                            password,
                            options: { data: { full_name: name } }
                        });
                        if (error) throw error;
                        if (data.session) {
                            setPendingLogin(true);
                        } else {
                            showToast("Pendaftaran berhasil! Cek email Anda untuk konfirmasi, lalu login.");
                            setIsLogin(true);
                        }
                    }
                } catch (err) {
                    showToast(translateError(err.message));
                } finally {
                    setLoading(false);
                }
            };

            const handleForgot = async () => {
                if (!email) { showToast("Isi email terlebih dahulu."); return; }
                const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
                showToast(error ? translateError(error.message) : "Link reset password telah dikirim ke email Anda.");
            };

            const inputCls = "w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600";

            return (
                <div className="max-w-md mx-auto my-16 bg-white p-8 rounded-3xl shadow-xl border border-gray-100">

                        <div className="w-14 h-14 bg-brand-50 text-brand-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-inner">

                        <p className="text-xs text-gray-500 mt-1">
                            {isLogin ? 'Masuk dengan email dan password Anda' : 'Daftar akun baru untuk mulai memesan kue lontar'}
                        </p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4">
                        {!isLogin && (
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1">Nama Lengkap</label>
                                <input type="text" value={name} onChange={(e) => setName(e.target.value)}
                                    placeholder="cth: Budi Santoso" className={inputCls} required />
                            </div>
                        )}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1">Email</label>
                            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                                placeholder="cth: email@gmail.com" className={inputCls} autoComplete="email" required />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1">Password</label>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                                placeholder="Minimal 6 karakter" minLength={6} className={inputCls}
                                autoComplete={isLogin ? "current-password" : "new-password"} required />
                        </div>

                        <button
                            type="submit"

                            {loading ? 'Memproses...' : (isLogin ? 'Masuk ke Akun' : 'Daftar Akun Baru')}

                { id: "QRIS", name: "QRIS (GoPay, OVO, DANA, LinkAja)", desc: "Scan kode QR untuk pembayaran dari semua e-wallet & m-banking", icon: "fa-qrcode", badge: "Instan" },

            ];

            const [submitting, setSubmitting] = useState(false);

                e.preventDefault();
                if (!currentUser) { showToast("Harap login terlebih dahulu."); setCurrentView('auth'); return; }
                if (cart.length === 0) { showToast("Keranjang masih kosong."); return; }
                setSubmitting(true);
                // Pesanan dibuat di server: harga & stok divalidasi oleh database
                const { data, error } = await db.rpc('place_order', {
                    p_items: cart.map(i => ({ product_id: i.product.id, quantity: i.quantity })),
                    p_address: address,
                    p_payment_method: paymentMethod
                });
                setSubmitting(false);
                if (error) {
                    showToast(`Gagal membuat pesanan: ${error.message}`);
                    fetchProducts();
                    return;
                }

                setActiveOrder(mapOrder({ ...data, order_items: cart.map(i => ({ product_name: i.product.name, quantity: i.quantity, price: i.product.price })) }));
                setCart([]);
                fetchOrders();
                fetchProducts();

                showToast(`Pesanan ${data.id} berhasil dibuat dengan ${paymentMethod}! Silakan pantau status pengiriman.`);
                setCurrentView('tracking');

                                        placeholder="cth: Jl. Ahmad Yani No. 45, Jayapura Utara (patokan: depan masjid)"

                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600"

                            {/* Pilihan Metode Pembayaran */}

                                <h3 className="font-bold text-sm text-gray-900 flex items-center space-x-2">
                                    <i className="fa-solid fa-credit-card text-brand-600"></i>
                                    <span>Pilih Metode Pembayaran</span>
                                </h3>
                                <div className="space-y-3">
                                    {paymentOptions.map((opt) => (
                                        <label

                                                paymentMethod === opt.id 
                                                    ? 'border-brand-600 bg-brand-50/40 shadow-sm' 
                                                    : 'border-gray-100 bg-gray-50/50 hover:border-gray-200'
                                            }`}
                                        >
                                            <div className="flex items-start space-x-3">
                                                <input 
                                                    type="radio" 
                                                    name="paymentMethod" 
                                                    value={opt.id}
                                                    checked={paymentMethod === opt.id}
                                                    onChange={() => setPaymentMethod(opt.id)}
                                                    className="mt-1 text-brand-600 focus:ring-brand-500"
                                                />
                                                <div>
                                                    <div className="flex items-center space-x-2">
                                                        <span className="font-bold text-xs text-gray-900">{opt.name}</span>
                                                        <span className="text-[10px] bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full font-bold">{opt.badge}</span>
                                                    </div>
                                                    <p className="text-[11px] text-gray-500 mt-1">{opt.desc}</p>
                                                </div>
                                            </div>
                                            <i className={`fa-solid ${opt.icon} text-gray-400 text-lg`}></i>
                                        </label>
                                    ))}
                                </div>

                                {/* Petunjuk Tambahan Sesuai Pilihan */}
                                {paymentMethod.startsWith("Transfer") && (
                                    <div className="p-4 bg-blue-50 border border-blue-100 rounded-2xl space-y-2 text-xs text-blue-900">
                                        <div className="font-bold flex items-center space-x-2">
                                            <i className="fa-solid fa-circle-info text-blue-600"></i>
                                            <span>Instruksi {paymentMethod}:</span>
                                        </div>
                                        <p>Silakan lakukan transfer ke nomor rekening resmi toko di atas sesuai dengan total tagihan. Pesanan akan segera diproses setelah konfirmasi.</p>
                                    </div>
                                )}
                                {paymentMethod === "QRIS" && (
                                    <div className="p-4 bg-amber-50 border border-amber-100 rounded-2xl space-y-2 text-xs text-amber-900 text-center">
                                        <div className="font-bold flex items-center justify-center space-x-2">
                                            <i className="fa-solid fa-qrcode text-amber-600"></i>
                                            <span>Pembayaran via QRIS</span>
                                        </div>
                                        <p>Gunakan aplikasi e-wallet (GoPay, OVO, DANA, ShopeePay) atau m-Banking untuk memindai kode QRIS resmi toko saat melakukan pembayaran.</p>
                                    </div>
                                )}
                                {paymentMethod === "COD" && (
                                    <div className="p-4 bg-emerald-50 border border-emerald-100 rounded-2xl space-y-2 text-xs text-emerald-900">
                                        <div className="font-bold flex items-center space-x-2">
                                            <i className="fa-solid fa-hand-holding-dollar text-emerald-600"></i>
                                            <span>Bayar di Tempat (COD):</span>
                                        </div>
                                        <p>Siapkan uang pas sebesar total tagihan saat driver kami mengantarkan kue lontar ke lokasi tujuan Anda.</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Ringkasan Pembayaran */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-4 h-fit">
                            <h3 className="font-bold text-base text-gray-900 border-b pb-3">Ringkasan Pembayaran</h3>
                            <div className="space-y-2 text-xs text-gray-600">
                                <div className="flex justify-between">
                                    <span>Subtotal Produk</span>
                                    <span>Rp {cartTotal.toLocaleString('id-ID')}</span>
                                </div>
                                <div className="flex justify-between">
                                    <span>Ongkos Kirim</span>
                                    <span>Rp 15.000</span>
                                </div>
                                <div className="flex justify-between font-bold text-gray-800 border-t pt-2">
                                    <span>Metode Pembayaran</span>
                                    <span className="text-brand-600 truncate max-w-[130px]">{paymentMethod}</span>
                                </div>
                            </div>
                            <div className="flex justify-between text-sm font-extrabold text-gray-900 border-t pt-3">
                                <span>Total Tagihan</span>
                                <span className="text-brand-600">Rp {(cartTotal + 15000).toLocaleString('id-ID')}</span>
                            </div>
                            <button 
                                type="submit"
                                disabled={submitting || cart.length === 0}
                                className="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all text-xs">
                                {submitting ? 'Memproses Pesanan...' : 'Konfirmasi & Buat Pesanan'}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function TrackingScreen({ orders, activeOrder, setActiveOrder, setCurrentView }) {
            if (!activeOrder) {
                return (
                    <div className="max-w-4xl mx-auto px-4 py-16 text-center space-y-4">
                        <h2 className="text-2xl font-bold">Belum ada pesanan aktif</h2>
                        <button onClick={() => setCurrentView('products')} className="bg-brand-600 text-white px-6 py-3 rounded-xl text-xs font-bold">Mulai Belanja</button>
                    </div>
                );
            }

            const steps = ["Driver Menuju Toko", "Driver Mengambil Pesanan", "Driver Antar ke Alamat"];
            const currentStepIdx = steps.indexOf(activeOrder.status);

            return (
                <div className="max-w-3xl mx-auto px-4 py-12 space-y-8">
                    <div className="flex justify-between items-center">
                        <div>
                            <span className="text-xs font-bold text-brand-600 uppercase tracking-widest">Tracking Real-Time</span>
                            <h1 className="text-2xl font-extrabold text-gray-900">Pesanan #{activeOrder.id}</h1>
                        </div>
                        <span className="bg-brand-50 text-brand-700 font-bold text-xs px-4 py-2 rounded-full border border-brand-100">
                            Status: {activeOrder.status}
                        </span>
                    </div>

                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-8">
                        <div className="relative flex justify-between max-w-lg mx-auto">
                            <div className="absolute top-1/2 left-0 right-0 h-1 bg-gray-200 -translate-y-1/2 z-0"></div>
                            {steps.map((step, idx) => {
                                const isDone = idx <= currentStepIdx;
                                return (
                                    <div key={step} className="relative z-10 flex flex-col items-center space-y-2">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs shadow-md ${isDone ? 'bg-brand-600 text-white' : 'bg-gray-200 text-gray-500'}`}>
                                            {idx + 1}
                                        </div>
                                        <span className={`text-[11px] font-bold text-center max-w-[100px] ${isDone ? 'text-brand-700' : 'text-gray-400'}`}>{step}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-3">
                        <h3 className="font-bold text-sm text-gray-900 border-b pb-2">Rincian Pesanan & Pembayaran</h3>
                        {activeOrder.items && activeOrder.items.length > 0 && (
                            <div className="space-y-1 text-xs border-b pb-3">
                                {activeOrder.items.map((it, idx) => (
                                    <div key={idx} className="flex justify-between">
                                        <span className="text-gray-700">{it.quantity}x {it.name}</span>
                                        <span className="font-semibold text-gray-800">Rp {(it.price * it.quantity).toLocaleString('id-ID')}</span>
                                    </div>
                                ))}
                                <div className="flex justify-between text-gray-500">
                                    <span>Ongkos Kirim</span><span>Rp {SHIPPING_FEE.toLocaleString('id-ID')}</span>
                                </div>
                            </div>
                        )}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                            <div>
                                <span className="text-gray-400 block">Metode Pembayaran</span>
                                <span className="font-bold text-gray-800">{activeOrder.paymentMethod}</span>
                            </div>
                            <div>
                                <span className="text-gray-400 block">Total Pembayaran</span>
                                <span className="font-bold text-brand-600">Rp {Number(activeOrder.total).toLocaleString('id-ID')}</span>
                            </div>
                            <div className="col-span-1 sm:col-span-2">
                                <span className="text-gray-400 block">Alamat Pengiriman</span>
                                <span className="font-semibold text-gray-700">{activeOrder.address}</span>
                            </div>
                            <div className="col-span-1 sm:col-span-2">
                                <span className="text-gray-400 block">Tanggal Pesanan</span>
                                <span className="font-semibold text-gray-700">{activeOrder.date}</span>
                            </div>
                        </div>
                    </div>

                    {orders && orders.length > 1 && (
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-3">
                            <h3 className="font-bold text-sm text-gray-900 border-b pb-2">Riwayat Pesanan Saya</h3>
                            <div className="space-y-2">
                                {orders.map(o => (
                                    <button key={o.id} onClick={() => setActiveOrder(o)}
                                        className={`w-full flex justify-between items-center p-3 rounded-2xl border text-xs text-left transition-all ${o.id === activeOrder.id ? 'border-brand-600 bg-brand-50/40' : 'border-gray-100 hover:border-gray-200'}`}>
                                        <span><span className="font-bold text-gray-900">{o.id}</span> <span className="text-gray-500">· {o.date}</span></span>
                                        <span className="font-bold text-brand-600">{o.status}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminScreen({ products, fetchProducts, orders, setOrders, fetchOrders, showToast }) {
            const [activeTab, setActiveTab] = useState("orders");
            const [editing, setEditing] = useState(null);   // produk yang sedang diedit / dibuat
            const [saving, setSaving] = useState(false);
            const [uploading, setUploading] = useState(false);

            const STATUSES = ["Driver Menuju Toko", "Driver Mengambil Pesanan", "Driver Antar ke Alamat"];

            const updateOrderStatus = async (orderId, newStatus) => {
                const prev = orders;
                setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
                // Notifikasi ke customer dibuat otomatis oleh trigger di database
                const { error } = await db.from('orders').update({ status: newStatus }).eq('id', orderId);
                if (error) {
                    setOrders(prev);
                    showToast(`Gagal mengubah status: ${error.message}`);
                    return;
                }
                showToast(`Status pesanan ${orderId} diubah ke "${newStatus}"!`);
            };

            const emptyProduct = { id: null, name: "", size: "Reguler (22cm)", price: 0, stock: 0, image_url: "", description: "", is_active: true };

            const saveProduct = async (e) => {
                e.preventDefault();
                setSaving(true);
                const payload = {
                    name: editing.name.trim(),
                    size: editing.size.trim(),
                    price: Number(editing.price) || 0,
                    stock: Number(editing.stock) || 0,
                    image_url: editing.image_url || null,
                    description: editing.description.trim(),
                    is_active: editing.is_active
                };
                const { error } = editing.id
                    ? await db.from('products').update(payload).eq('id', editing.id)
                    : await db.from('products').insert(payload);
                setSaving(false);
                if (error) { showToast(`Gagal menyimpan produk: ${error.message}`); return; }
                showToast(`Produk "${payload.name}" berhasil disimpan!`);
                setEditing(null);
                fetchProducts();
            };

            const deleteProduct = async (product) => {
                if (!window.confirm(`Hapus produk "${product.name}"? Riwayat pesanan lama tetap tersimpan.`)) return;
                const { error } = await db.from('products').delete().eq('id', product.id);
                if (error) { showToast(`Gagal menghapus: ${error.message}`); return; }
                showToast(`Produk "${product.name}" dihapus.`);
                fetchProducts();
            };

            const uploadImage = async (file) => {
                if (!file) return;
                setUploading(true);
                const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
                const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
                const { error } = await db.storage.from('product-images').upload(path, file, { contentType: file.type });
                setUploading(false);
                if (error) { showToast(`Gagal upload foto: ${error.message}`); return; }
                const { data } = db.storage.from('product-images').getPublicUrl(path);
                setEditing(prev => ({ ...prev, image_url: data.publicUrl }));
                showToast("Foto berhasil diupload. Klik Simpan untuk menerapkan.");
            };

            const totalRevenue = orders.reduce((sum, o) => sum + Number(o.total || 0), 0);
            const inputCls = "w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600";
            const tabCls = (t) => `px-5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === t ? 'bg-white text-brand-600 shadow-sm' : 'text-gray-600'}`;

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <span className="text-xs font-bold text-brand-600 uppercase tracking-widest">Dashboard Toko</span>
                            <h1 className="text-3xl font-extrabold text-gray-900">Admin Panel Lontar Cake Papua</h1>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button
                                onClick={() => { fetchOrders(); fetchProducts(); showToast("Data diperbarui dari database."); }}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow flex items-center space-x-2">
                                <i className="fa-solid fa-database"></i>
                                <span>Database Terhubung · Refresh</span>
                            </button>
                            <div className="flex space-x-2 bg-gray-100 p-1.5 rounded-2xl">
                                <button onClick={() => setActiveTab('orders')} className={tabCls('orders')}>
                                    <i className="fa-solid fa-list-check mr-1.5"></i> Kelola Pesanan ({orders.length})
                                </button>
                                <button onClick={() => setActiveTab('products')} className={tabCls('products')}>
                                    <i className="fa-solid fa-box mr-1.5"></i> Kelola Produk ({products.length})
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
                            <span className="text-[11px] text-gray-500 font-bold uppercase">Total Pesanan</span>
                            <div className="text-2xl font-extrabold text-gray-900">{orders.length}</div>
                        </div>
                        <div className="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
                            <span className="text-[11px] text-gray-500 font-bold uppercase">Total Omzet</span>
                            <div className="text-2xl font-extrabold text-brand-600">Rp {totalRevenue.toLocaleString('id-ID')}</div>
                        </div>
                        <div className="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
                            <span className="text-[11px] text-gray-500 font-bold uppercase">Produk Stok Menipis (&lt; 5)</span>
                            <div className="text-2xl font-extrabold text-gray-900">{products.filter(p => p.stock < 5).length}</div>
                        </div>
                    </div>

                    {activeTab === 'orders' && (
                        <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-100 space-y-6">
                            <h3 className="font-bold text-base text-gray-900">Daftar Pesanan Masuk (Real-time Sync ke User)</h3>
                            {orders.length === 0 && <p className="text-xs text-gray-500">Belum ada pesanan.</p>}
                            <div className="space-y-4">
                                {orders.map(order => (
                                    <div key={order.id} className="p-6 bg-gray-50 rounded-2xl border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div className="space-y-1">
                                            <div className="flex items-center flex-wrap gap-2">
                                                <span className="font-extrabold text-sm text-gray-900">{order.id}</span>
                                                <span className="text-xs text-gray-500">- {order.customer}</span>
                                                <span className="bg-brand-100 text-brand-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full">{order.status}</span>
                                                <span className="text-[10px] text-gray-400">{order.date}</span>
                                            </div>
                                            <p className="text-xs text-gray-700">
                                                {order.items.map(i => `${i.quantity}x ${i.name}`).join(', ')}
                                            </p>
                                            <p className="text-xs text-gray-600">Alamat: {order.address}</p>
                                            <p className="text-xs font-bold text-gray-800">Total: Rp {Number(order.total).toLocaleString('id-ID')} ({order.paymentMethod})</p>
                                        </div>
                                        <div className="flex items-center space-x-2 w-full md:w-auto">
                                            <select
                                                value={order.status}
                                                onChange={(e) => updateOrderStatus(order.id, e.target.value)}
                                                className="px-4 py-2.5 bg-white border border-gray-300 rounded-xl text-xs font-bold text-gray-800 focus:outline-none focus:border-brand-600">
                                                {STATUSES.map((st, idx) => (
                                                    <option key={st} value={st}>{idx + 1}. {st}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'products' && (
                        <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-100 space-y-6">
                            <div className="flex justify-between items-center">
                                <h3 className="font-bold text-base text-gray-900">Katalog Produk</h3>
                                <button onClick={() => setEditing({ ...emptyProduct })}
                                    className="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow">
                                    <i className="fa-solid fa-plus mr-1.5"></i> Tambah Produk
                                </button>
                            </div>
                            <div className="space-y-3">
                                {products.map(p => (
                                    <div key={p.id} className="p-4 bg-gray-50 rounded-2xl border border-gray-200 flex items-center gap-4">
                                        <img src={p.image} onError={onImgError} alt={p.name} className="w-16 h-16 object-cover rounded-xl" />
                                        <div className="flex-grow">
                                            <div className="font-bold text-sm text-gray-900">
                                                {p.name} {!p.is_active && <span className="text-[10px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full ml-1">Disembunyikan</span>}
                                            </div>
                                            <div className="text-xs text-gray-500">{p.size} · Rp {p.price.toLocaleString('id-ID')} ·
                                                <span className={p.stock < 5 ? 'text-brand-600 font-bold' : ''}> Stok {p.stock}</span>
                                            </div>
                                        </div>
                                        <button onClick={() => setEditing({ ...p, image_url: p.image_url || "" })} className="px-3 py-2 bg-white border border-gray-300 rounded-xl text-xs font-bold hover:border-brand-600">
                                            <i className="fa-solid fa-pen"></i> Edit
                                        </button>
                                        <button onClick={() => deleteProduct(p)} className="px-3 py-2 bg-white border border-gray-300 rounded-xl text-xs font-bold text-brand-600 hover:border-brand-600">
                                            <i className="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {editing && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                            <form onSubmit={saveProduct} className="bg-white max-w-lg w-full p-6 rounded-3xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-extrabold text-lg text-gray-900">{editing.id ? 'Edit Produk' : 'Tambah Produk Baru'}</h3>
                                    <button type="button" onClick={() => setEditing(null)} className="text-gray-400 hover:text-gray-700 font-bold">✕</button>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Nama Produk</label>
                                    <input className={inputCls} value={editing.name} onChange={e => setEditing({ ...editing, name: e.target.value })} required />
                                </div>
                                <div className="grid grid-cols-3 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Ukuran</label>
                                        <input className={inputCls} value={editing.size} onChange={e => setEditing({ ...editing, size: e.target.value })} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Harga (Rp)</label>
                                        <input type="number" min="0" className={inputCls} value={editing.price} onChange={e => setEditing({ ...editing, price: e.target.value })} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Stok</label>
                                        <input type="number" min="0" className={inputCls} value={editing.stock} onChange={e => setEditing({ ...editing, stock: e.target.value })} required />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Deskripsi</label>
                                    <textarea rows="3" className={inputCls} value={editing.description} onChange={e => setEditing({ ...editing, description: e.target.value })}></textarea>
                                </div>
                                <div className="space-y-2">
                                    <label className="block text-xs font-bold text-gray-700">Foto Produk</label>
                                    <div className="flex items-center gap-3">
                                        <img src={editing.image_url || FALLBACK_IMG} onError={onImgError} className="w-16 h-16 object-cover rounded-xl border" alt="" />
                                        <input type="file" accept="image/*" onChange={e => uploadImage(e.target.files[0])} className="text-xs" />
                                    </div>
                                    {uploading && <p className="text-[11px] text-gray-500"><i className="fa-solid fa-spinner fa-spin mr-1"></i>Mengupload...</p>}
                                    <input className={inputCls} placeholder="atau tempel URL gambar / images/nama-file.jpg" value={editing.image_url} onChange={e => setEditing({ ...editing, image_url: e.target.value })} />
                                </div>
                                <label className="flex items-center space-x-2 text-xs font-bold text-gray-700">
                                    <input type="checkbox" checked={editing.is_active} onChange={e => setEditing({ ...editing, is_active: e.target.checked })} />
                                    <span>Tampilkan di katalog</span>
                                </label>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button type="button" onClick={() => setEditing(null)} className="px-5 py-2.5 rounded-xl text-xs font-bold text-gray-600">Batal</button>
                                    <button type="submit" disabled={saving || uploading} className="bg-brand-600 disabled:opacity-60 text-white px-6 py-2.5 rounded-xl text-xs font-bold shadow">
                                        {saving ? 'Menyimpan...' : 'Simpan'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        function Footer({ setCurrentView }) {
            return (
                <footer className="bg-brand-800 text-white pt-12 pb-8 mt-20">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                        <div>
                            <div className="flex items-center space-x-3 mb-4">
                                <span className="text-2xl font-extrabold tracking-tight font-sans">Lontar Cake Papua</span>
                            </div>
                            <p className="text-brand-100 text-xs leading-relaxed max-w-sm">
                                Menyajikan kue lontar tradisional berkualitas tinggi dengan cita rasa lumer dan manis yang pas di lidah sejak 1910.
                            </p>
                        </div>
